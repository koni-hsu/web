<style>

*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
a{color:inherit}button{font:inherit;cursor:pointer}
.w{max-width:1150px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;z-index:50;background:var(--n);color:#fff}
nav .w{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;cursor:pointer}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--r),var(--g));display:grid;place-items:center;font-style:normal}
.logo i.lg{background:#fff;padding:3px;width:44px;height:44px;overflow:hidden;flex:none}.logo i.lg img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}

.burger{display:none;background:none;border:0;color:#fff;font-size:26px}

.hero:after{width:260px;height:260px;background:var(--g);opacity:.25;bottom:-60px;left:8%;animation-delay:-4s}

.hero .w{position:relative;z-index:1}
.hl{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:#fff;border-radius:32px;padding:22px 26px;box-shadow:0 30px 70px rgba(0,0,0,.45);animation:fl2 6s ease-in-out infinite}.hl img{width:220px;display:block}
@keyframes fl2{50%{transform:translateY(-54%)}}
.fl{display:flex;gap:14px;align-items:center}.fl i{background:#fff;border-radius:14px;padding:4px;display:block}.fl img{height:54px;display:block}

.btn.o{background:rgba(255,255,255,.12);margin-left:8px}.btn.s{padding:7px 14px;font-size:13px}.btn.g{background:var(--bg);color:var(--t)}.btn.d{background:#fee;color:var(--r)}

<nav><div class="w">
  <button class="burger" aria-label="Buka menu" onclick="toggleNav()">☰</button>
  <div class="logo" onclick="go('home')"><i class="lg"><img data-logo alt="Logo KONI HSU"></i><div>KONI<small>Kab. Hulu Sungai Utara</small></div></div>

    <a data-p="home" onclick="go('home')">Home</a><a data-p="profil" onclick="go('profil')">Profile</a><div class="dd"><a class="dt" data-p="berita,artikel,media" onclick="this.parentNode.classList.toggle('open')">Berita ▾</a><div class="dm"><a data-p="artikel" onclick="go('artikel')">📰 Artikel</a><a data-p="media" onclick="go('media')">🎬 Media</a></div></div>

<script>
const $=s=>document.querySelector(s);
document.querySelectorAll('img[data-logo]').forEach(i=>i.src=LOGO);
(function(){['icon','apple-touch-icon'].forEach(function(r){var l=document.querySelector('link[rel="'+r+'"]');if(!l){l=document.createElement('link');l.rel=r;document.head.appendChild(l)}l.href=LOGO})})(); // logo KONI sebagai ikon tab browser
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const run=api;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)};
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const MK='Porprov 2025 (Medali)';
let S={berita:[],atlet:[],profil:{}},page='home',cs='',cq='',ct='pert',lim=100,CL=[],ac='',ak='',aq='',pc='',pm='',pq='',ck='',bq='',kc='';
const TABLE_COLS=['Nama Atlet','Cabor','Pertandingan','Kategori','Medali'];

function applyData(d){S=d;S.cabor=S.cabor||[];S.pertandingan=S.pertandingan||[];S.dataatlet=S.dataatlet||[];S.kategoricabor=S.kategoricabor||[];S.ath=athletes();render();$('#ft').textContent=String((S.profil&&S.profil.alamat)||'').replace(/\bKabupaten\b/g,'Kab.')}
const CK='koni_hsu_data_v2';
function load(bg){
  let cached=null,raw=null;
  try{raw=localStorage.getItem(CK);if(raw)cached=JSON.parse(raw)}catch(e){}
  if(cached&&!bg){try{applyData(cached)}catch(e){cached=null}}
  run('getData').then(d=>{
    let j=null;try{j=JSON.stringify(d)}catch(e){}
    if(j&&j===raw&&cached)return;
    try{if(j)localStorage.setItem(CK,j)}catch(e){}
    const busy=document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if(!cached||!busy)applyData(d);
  }).catch(e=>{if(!cached)$('#app').innerHTML='<div class="ld">Gagal memuat: '+esc(e.message)+'</div>'});
}
function setBurger(){var b=document.querySelector('.burger');if(b)b.textContent=document.body.classList.contains('nav-open')?'✕':'☰'}
function toggleNav(){$('.menu').classList.toggle('on');document.body.classList.toggle('nav-open');setBurger()}
function closeNav(){$('.menu').classList.remove('on');document.body.classList.remove('nav-open');setBurger()}
document.addEventListener('click',function(e){if(document.body.classList.contains('nav-open')&&!e.target.closest('.menu,.burger'))closeNav()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeNav()});
function go(p){page=p;lim=100;document.querySelectorAll('.dd').forEach(d=>d.classList.remove('open'));closeNav();render();scrollTo(0,0)}
function render(){
  document.querySelectorAll('.menu a').forEach(a=>a.classList.toggle('on',a.dataset.p.split(',').includes(page)));
  $('#app').innerHTML=({home,profil,berita,artikel:berita,media:berita,cabor,atlet,porprov})[page]();
  if(page==='home')count();
  const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.1});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
}
const medals=()=>{const c={Emas:0,Perak:0,Perunggu:0};S.atlet.forEach(a=>c[a.Medali]!==undefined&&c[a.Medali]++);return c};
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const nk=(a,c)=>String(a||'').trim().replace(/\s+/g,' ').toLowerCase()+'|'+String(c||'').trim().toLowerCase();
function athletes(){const m={};S.dataatlet.forEach(a=>{m[nk(a['Nama Atlet'],a.Cabor)]={n:String(a['Nama Atlet']).trim(),c:a.Cabor,jk:a['Jenis Kelamin'],f:a['Foto Profil']||'',p:[]}});
  S.atlet.forEach(r=>{const k=nk(r['Nama Atlet'],r.Cabor);(m[k]=m[k]||{n:r['Nama Atlet'],c:r.Cabor,jk:'',p:[]}).p.push(r)});
  return Object.values(m).sort((a,b)=>String(a.n).localeCompare(String(b.n)))}
const mcount=rows=>{const c={Emas:0,Perak:0,Perunggu:0};rows.forEach(r=>c[r.Medali]!==undefined&&c[r.Medali]++);return c};
const mbadge=c=>`<div class="md"><span class="bd Emas">🥇 ${c.Emas}</span><span class="bd Perak">🥈 ${c.Perak}</span><span class="bd Perunggu">🥉 ${c.Perunggu}</span></div>`;
function pertOf(cab){const m={};S.pertandingan.filter(p=>p.Cabor===cab).forEach(p=>m[p['Nama Pertandingan']]={n:p['Nama Pertandingan'],k:p.Kategori,r:[]});
  S.atlet.filter(r=>r.Cabor===cab&&r.Pertandingan).forEach(r=>{(m[r.Pertandingan]=m[r.Pertandingan]||{n:r.Pertandingan,k:r.Kategori,r:[]}).r.push(r)});
  return Object.values(m).sort((a,b)=>a.n.localeCompare(b.n))}
const av=(a,b)=>`<div class="av${b?' big':''}"${a.f?` style="background:url('${esc(a.f)}') center/cover"`:''}>${a.f?'':esc(ini(a.n))}</div>`;
const kpOf=n=>S.cabor.find(c=>c['Nama Cabor']===n)||{};
const kpInfo=(n,big)=>{const c=kpOf(n);return `<div class="kp${big?' big':''}"><div><small>👤 Ketua Cabor</small><b>${esc(String(c['Ketua Cabor']||'').trim()||'-')}</b></div>${String(c.Kategori||'').trim()?`<div><small>🏷️ Kategori</small><b>${esc(String(c.Kategori).trim())}</b></div>`:''}</div>`};
const KAT=['Beregu','Perorangan'],hasD=c=>c.pt>0||c.a>0;
const caborList=kat=>{const m={};S.cabor.forEach(c=>c['Nama Cabor']&&(m[c['Nama Cabor']]=1));S.atlet.forEach(r=>r.Cabor&&(m[r.Cabor]=1));
  return Object.keys(m).sort((a,b)=>a.localeCompare(b)).map(n=>({n,pt:pertOf(n).filter(p=>!kat||p.k===kat).length,a:S.ath.filter(x=>x.c===n&&(!kat||x.p.some(r=>r.Kategori===kat))).length,m:mcount(S.atlet.filter(r=>r.Cabor===n&&(!kat||r.Kategori===kat)))}))};
const fmtD=d=>{try{return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
function newsCard(b){return `<div class="card h" onclick="readNews('${esc(b.ID)}')"><div class="img" style="${b.Gambar?`background-image:url('${esc(b.Gambar)}')`:''}">${b.Gambar?'':'📰'}</div><div class="pd"><small>${esc(fmtD(b.Tanggal))}</small><h3>${esc(b.Judul)}</h3><p>${esc(b.Ringkasan)}</p></div></div>`}
function home(){
  const m=medals(),cb=caborList().length;
  return `<div class="hero"><div class="w"><div class="hl"><img src="${LOGO}" alt="Logo KONI HSU"></div><span class="tag">🏅 Komite Olahraga Nasional Indonesia</span>
  <h1>Membangun <span>Prestasi</span> Olahraga Hulu Sungai Utara</h1>
  <p>Portal resmi informasi cabang olahraga, atlet berprestasi, dan berita terbaru KONI Kab. Hulu Sungai Utara.</p></div></div>
  <div class="w"><div class="stats">
  ${[[cb,'Cabang Olahraga','🏟️'],[S.atlet.length,'Atlet Berprestasi','🏃'],[m.Emas,'Medali Emas','🥇'],[m.Perak,'Medali Perak','🥈'],[m.Perunggu,'Medali Perunggu','🥉']].map(x=>`<div class="st"><i>${x[2]}</i><b data-c="${x[0]}">0</b><span>${x[1]}</span></div>`).join('')}
  </div><p class="cap">🏅 <b>Prestasi Kontingen Hulu Sungai Utara pada Porprov 2025</b> · jumlah medali dihitung per atlet</p></div>
`;
}
function count(){document.querySelectorAll('[data-c]').forEach(el=>{const t=+el.dataset.c;let n=0;const st=Math.max(1,Math.ceil(t/40));const iv=setInterval(()=>{n=Math.min(t,n+st);el.textContent=n;if(n>=t)clearInterval(iv)},25)})}
const isBerita=()=>page==='berita'||page==='artikel'||page==='media';
const embedUrl=u=>{u=String(u||'').trim();let m=u.match(/instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/i);if(m)return{u:'https://www.instagram.com/'+(m[1].toLowerCase().startsWith('reel')?'reel':m[1].toLowerCase())+'/'+m[2]+'/embed',t:'ig'};
  m=u.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/);if(m)return{u:'https://www.youtube.com/embed/'+m[1],t:'yt'};return null};
function mediaCard(b){const e=embedUrl(b['Link Video']);if(!e)return newsCard(b);
  return `<div class="card"><div class="vid ${e.t}"><iframe src="${esc(e.u)}" loading="lazy" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" title="${esc(b.Judul)}"></iframe></div><div class="pd"><small>${esc(fmtD(b.Tanggal))}</small><h3>${esc(b.Judul)}</h3><p>${esc(b.Ringkasan)}</p></div></div>`}
function berita(){const md=page==='media';
  return (md?hd('Media <span>KONI HSU</span>','Liputan, foto, dan publikasi media KONI Hulu Sungai Utara','🎬 Media'):hd('Artikel <span>Terbaru</span>','Kabar terkini dari dunia olahraga Hulu Sungai Utara','📰 Artikel'))+`<div class="w pg">${md?'<div class="igb"><span>📸 Ikuti Instagram <b>@konikab.hsu</b> untuk video &amp; kegiatan terbaru</span><a class="btn s" href="https://www.instagram.com/konikab.hsu/" target="_blank" rel="noopener">Buka Instagram</a></div>':''}<div class="bar"><input placeholder="🔍 Cari ${md?'media':'artikel'}…" value="${esc(bq)}" oninput="bq=this.value;lim=100;upd()"></div><div id="cl">${beritaBody()}</div></div>`}
function beritaBody(){const kat=page==='media'?'Media':'Artikel',q=bq.toLowerCase(),all=S.berita.filter(b=>(String(b.Kategori||'').trim().toLowerCase()||'artikel')===kat.toLowerCase()),f=all.filter(b=>!q||[b.Judul,b.Ringkasan,b.Isi].join(' ').toLowerCase().includes(q)),nm=kat.toLowerCase();
  return f.length?`<p class="sub">${f.length} ${nm}</p><div class="grid">${f.map(kat==='Media'?mediaCard:newsCard).join('')}</div>`:`<p class="sub">${all.length?(kat+' tidak ditemukan.'):'Belum ada '+nm+'.'}</p>`}
function readNews(id){const b=S.berita.find(x=>String(x.ID)===String(id));if(!b)return;
  openM(`<small style="color:var(--r);font-weight:700">${esc(fmtD(b.Tanggal))}</small><h2 style="margin:6px 0 14px">${esc(b.Judul)}</h2>${b.Gambar?`<img src="${esc(b.Gambar)}" style="width:100%;border-radius:16px;margin-bottom:14px">`:''}<div>${lines(b.Isi||b.Ringkasan).map(p=>`<p style="margin-bottom:10px">${esc(p).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--r);word-break:break-all">$1</a>')}</p>`).join('')}</div><br><button class="btn g" onclick="closeM()">Tutup</button>`)}
function profil(){const p=S.profil;
  return hd('Profile <span>KONI HSU</span>','Mengenal organisasi, visi, dan misi kami','🏛️ Profil Organisasi')+`
  <div class="w pg"><div class="box rv"><h3>🎯 Visi</h3><p>${esc(p.visi)}</p></div>
  <div class="box rv"><h3>🚀 Misi</h3><ol>${lines(p.misi).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
  <div class="box rv"><h3>📖 Sejarah</h3>${lines(p.sejarah).map(x=>`<p>${esc(x)}</p>`).join('')}</div>
  <div class="box rv"><h3>👥 Struktur Organisasi</h3><div class="org">${lines(p.struktur).map(l=>{const[a,b]=l.split('|');return `<div><small>${esc((a||'').trim())}</small><b>${esc((b||'').trim())}</b></div>`}).join('')}</div></div>
  <div class="box rv"><h3>📍 Kontak</h3><p>${esc(p.alamat)}<br>Telp: ${esc(p.telepon)} · Email: ${esc(p.email)}</p></div></div>`}
const hd=(t,p,g)=>`<div class="ph"><div class="w"><span class="tag">${g||'🏅 KONI Hulu Sungai Utara'}</span><h1>${t}</h1><p>${p}</p></div></div>`;
const MED=['Emas','Perak','Perunggu'];
const opt=(l,v)=>l.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function upd(){$('#cl').innerHTML=isBerita()?beritaBody():page==='cabor'?(cs?cDetail():cList()):page==='atlet'?atBody():prBody()}
/* ---- Cabang Olahraga ---- */
const chips=(list,cur,fn)=>`<div class="tabs">${list.map(([v,l])=>`<button class="${cur===v?'on':''}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`;
function setCk(v){ck=v;render()}
function cabor(){
  if(cs){const ks=[...new Set(pertOf(cs).map(p=>p.k))].filter(k=>KAT.includes(k));
    const inf=`<div class="box">${kpInfo(cs,1)}</div>`;
    return hd(`<span>${esc(cs)}</span>`+(ck?` · ${ck}`:''),'Jenis pertandingan dan atlet','🏟️ Cabang Olahraga')+`<div class="w pg"><div class="fx" style="margin-bottom:14px;justify-content:flex-end"><button class="btn backbtn" onclick="cs='';render()">← Semua Cabang Olahraga</button></div>${inf}
    ${ks.length>1?chips([['','Semua'],...ks.map(k=>[k,k])],ck,'setCk'):''}
    <div class="tabs">${[['pert','🎯 Jenis Pertandingan'],['atlet','🏃 Atlet']].map(([k,l])=>`<button class="${ct===k?'on':''}" onclick="ct='${k}';lim=100;render()">${l}</button>`).join('')}</div><div id="cl">${cDetail()}</div></div>`}
  return hd('Cabang <span>Olahraga</span>','Daftar cabang olahraga beserta jenis pertandingan dan atlet','🏟️ Cabang Olahraga')+`<div class="w pg"><div class="bar"><input placeholder="🔍 Cari cabang olahraga…" value="${esc(cq)}" oninput="cq=this.value;upd()"><select onchange="kc=this.value;upd()"><option value="">Semua Kategori</option>${opt(katList(),kc)}</select></div><div id="cl">${cList()}</div></div>`}
const katList=()=>{const m=S.kategoricabor.map(k=>String(k['Nama Kategori']||'').trim()).filter(Boolean);S.cabor.forEach(c=>{const k=String(c.Kategori||'').trim();if(k&&!m.includes(k))m.push(k)});return m};
function cList(){const q=cq.toLowerCase(),ok=c=>c.n.toLowerCase().includes(q)&&(!kc||String(kpOf(c.n).Kategori||'').trim()===kc);CL=[];
  const card=(c,k)=>{CL.push({n:c.n,k});return `<div class="card h cb" onclick="pick(${CL.length-1})"><h3>${esc(c.n)}</h3><div class="md"><span class="bd">🏃 ${c.a} atlet</span><span class="bd">🎯 ${c.pt} pertandingan</span></div>${kpInfo(c.n)}</div>`};
  const l=caborList().filter(ok);
  const h=l.length?`<h2 class="sec">Daftar Cabang Olahraga <span class="bd">${l.length} cabor</span></h2><div class="grid">${l.map(c=>card(c,'')).join('')}</div>`:'';
  return h||'<p class="sub">Cabang olahraga tidak ditemukan.</p>'}
function pick(i){cs=CL[i].n;ck=CL[i].k;ct='pert';lim=100;render()}
function cDetail(){return ct==='pert'?pertView():athGrid(S.ath.filter(a=>a.c===cs&&(!ck||a.p.some(r=>r.Kategori===ck))))}
function pertView(){const f=pertOf(cs).filter(p=>!ck||p.k===ck);
  return f.length?`<p class="sub">${f.length} jenis pertandingan</p><div class="tw"><table><tr><th>Pertandingan</th><th>Kategori</th><th>Medali Porprov 2025</th></tr>${f.map(p=>`<tr><td>${esc(p.n)}</td><td>${esc(p.k)}</td><td>${mbadge(mcount(p.r))}</td></tr>`).join('')}</table></div>`:'<p class="sub">Belum ada data jenis pertandingan.</p>'}
/* ---- Atlet ---- */
const katOf=n=>String(kpOf(n).Kategori||'').trim();
function atlet(){const cl=caborList().map(c=>c.n).filter(n=>!ak||katOf(n)===ak);
  return hd('Profil <span>Atlet</span>','Profil atlet KONI Hulu Sungai Utara','🏃 Atlet')+`<div class="w pg"><div class="bar"><input placeholder="🔍 Cari nama atlet…" value="${esc(aq)}" oninput="aq=this.value;lim=100;upd()"><select onchange="ak=this.value;ac='';lim=100;render()"><option value="">Semua Kategori Cabor</option>${opt(katList(),ak)}</select><select onchange="ac=this.value;lim=100;upd()"><option value="">Semua Cabang Olahraga</option>${opt(cl,ac)}</select></div><div id="cl">${atBody()}</div></div>`}
function atBody(){const q=aq.toLowerCase();return athGrid(S.ath.filter(a=>(!ac||a.c===ac)&&(!ak||katOf(a.c)===ak)&&(!q||a.n.toLowerCase().includes(q))))}
function athGrid(f){return f.length?`<p class="sub">${f.length} atlet</p><div class="grid g3">${f.slice(0,lim).map(a=>`<div class="card h ath" onclick="readAth(${S.ath.indexOf(a)})">${av(a)}<div><b>${esc(a.n)}</b><small>${esc(a.c)}${a.jk?' · '+esc(a.jk):''}</small>${mbadge(mcount(a.p))}</div></div>`).join('')}</div>${f.length>lim?`<br><button class="btn" onclick="lim+=100;upd()">Tampilkan lebih banyak</button>`:''}`:'<p class="sub">Atlet tidak ditemukan.</p>'}
function readAth(i){const a=S.ath[i];
  openM(`<div class="fx" style="justify-content:flex-start;gap:16px;margin-bottom:16px">${av(a,1)}<div><h2 style="margin:0">${esc(a.n)}</h2><p style="color:var(--m)">${esc(a.c)}${a.jk?' · '+esc(a.jk):''}</p></div></div>${mbadge(mcount(a.p))}<h3 style="margin:18px 0 6px">Prestasi Porprov 2025</h3>${a.p.length?a.p.map(r=>`<div class="pr"><div><b>${esc(r.Pertandingan)}</b><small>${esc(r.Kategori)}</small></div><span class="bd ${esc(r.Medali)}">${esc(r.Medali||'-')}</span></div>`).join(''):'<p class="sub">Belum ada data prestasi.</p>'}<br><button class="btn g" onclick="closeM()">Tutup</button>`)}
/* ---- Prestasi Atlet > Porprov 2025 ---- */
function filt(){const q=pq.toLowerCase();return S.atlet.filter(a=>MED.includes(a.Medali)&&(!pc||a.Cabor===pc)&&(!pm||a.Medali===pm)&&(!q||[a['Nama Atlet'],a.Pertandingan,a.Cabor].join(' ').toLowerCase().includes(q)))}
function porprov(){const m=medals(),tot=m.Emas+m.Perak+m.Perunggu;
  return hd('Prestasi Atlet · <span>Porprov 2025</span>','Daftar atlet Hulu Sungai Utara yang meraih medali pada Porprov 2025','🥇 Prestasi Atlet')+`<div class="w pg"><div class="stats" style="margin:0 0 24px">${[[tot,'Total Medali'],[m.Emas,'🥇 Emas'],[m.Perak,'🥈 Perak'],[m.Perunggu,'🥉 Perunggu']].map(x=>`<div class="st"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
  <div class="bar"><input placeholder="🔍 Cari atlet / pertandingan…" value="${esc(pq)}" oninput="pq=this.value;lim=100;upd()"><select onchange="pc=this.value;lim=100;upd()"><option value="">Semua Cabor</option>${opt(caborList().map(c=>c.n),pc)}</select><select onchange="pm=this.value;lim=100;upd()"><option value="">Semua Medali</option>${opt(MED,pm)}</select></div><div id="cl">${prBody()}</div></div>`}
function prBody(){const f=filt();return `<p class="sub">${f.length} atlet peraih medali</p><div class="tw"><table><tr><th>No</th>${TABLE_COLS.map(c=>`<th>${c}</th>`).join('')}</tr>${f.slice(0,lim).map((a,n)=>`<tr><td>${n+1}</td>${TABLE_COLS.map(c=>`<td>${c==='Medali'?`<span class="bd ${esc(a[c])}">${esc(a[c])}</span>`:esc(a[c])}</td>`).join('')}</tr>`).join('')}</table></div>${f.length>lim?`<br><button class="btn" onclick="lim+=100;upd()">Tampilkan lebih banyak</button>`:''}`}
function csv(){const f=filt(),h=Object.keys(f[0]||{});const t=[h].concat(f.map(r=>h.map(k=>r[k]))).map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='prestasi-porprov-2025.csv';a.click()}

function openM(h){$('#mb').innerHTML=h;$('#mo').classList.add('on')}
function closeM(){$('#mo').classList.remove('on')}
load();
/* Saat tab kembali aktif, ambil data terbaru di latar belakang (tanpa reload halaman) */
let lastF=Date.now();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastF>30000){lastF=Date.now();load(true)}});
</script>
</body>
</html>
