<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--r:#c8102e;--g:#f5b800;--n:#0b1330;--bg:#f4f6fb;--c:#fff;--t:#1b2240;--m:#6b7390;--b:#e4e8f2}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
a{color:inherit}button{font:inherit;cursor:pointer}
.w{max-width:1150px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;z-index:50;background:rgba(11,19,48,.85);backdrop-filter:blur(14px);color:#fff}
nav .w{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;cursor:pointer}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--r),var(--g));display:grid;place-items:center;font-style:normal}
.logo i.lg{background:#fff;padding:3px;width:44px;height:44px;overflow:hidden;flex:none}.logo i.lg img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.logo small{display:block;font-weight:400;font-size:11px;opacity:.7;line-height:1}
.menu{display:flex;gap:6px}
.menu a{padding:8px 16px;border-radius:99px;text-decoration:none;font-size:14px;font-weight:600;cursor:pointer;opacity:.8;transition:.2s}
.menu a:hover,.menu a.on{background:rgba(255,255,255,.14);opacity:1}
.menu a.adm{background:var(--g);color:var(--n);opacity:1}
.burger{display:none;background:none;border:0;color:#fff;font-size:26px}
.hero{background:radial-gradient(circle at 20% 20%,#7a0a1e,transparent 45%),radial-gradient(circle at 85% 70%,#1d3a8a,transparent 45%),var(--n);color:#fff;padding:90px 0 120px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);animation:fl 9s ease-in-out infinite}
.hero:before{width:320px;height:320px;background:var(--r);opacity:.35;top:-80px;right:10%}
.hero:after{width:260px;height:260px;background:var(--g);opacity:.25;bottom:-60px;left:8%;animation-delay:-4s}
@keyframes fl{50%{transform:translate(40px,30px) scale(1.15)}}
.hero .w{position:relative;z-index:1}
.hl{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:#fff;border-radius:32px;padding:22px 26px;box-shadow:0 30px 70px rgba(0,0,0,.45);animation:fl2 6s ease-in-out infinite}.hl img{width:220px;display:block}
@keyframes fl2{50%{transform:translateY(-54%)}}
.fl{display:flex;gap:14px;align-items:center}.fl i{background:#fff;border-radius:14px;padding:4px;display:block}.fl img{height:54px;display:block}
.tag{display:inline-block;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.12);font-size:13px;font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(32px,6vw,62px);font-weight:800;line-height:1.1;max-width:780px}
.hero h1 span{background:linear-gradient(90deg,var(--g),#ff7b7b);-webkit-background-clip:text;color:transparent}
.hero p{max-width:560px;margin:18px 0 28px;opacity:.8}
.btn{display:inline-block;border:0;padding:12px 24px;border-radius:99px;font-weight:700;background:var(--r);color:#fff;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(200,16,46,.35)}
.btn.o{background:rgba(255,255,255,.12);margin-left:8px}.btn.s{padding:7px 14px;font-size:13px}.btn.g{background:var(--bg);color:var(--t)}.btn.d{background:#fee;color:var(--r)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:-64px;position:relative;z-index:2}
.st{background:var(--c);border-radius:20px;padding:22px;box-shadow:0 12px 36px rgba(11,19,48,.09);text-align:center}
.st b{display:block;font-size:34px;font-weight:800}.st span{color:var(--m);font-size:13px}
.cap{text-align:center;color:var(--m);font-size:14px;margin-top:18px}
section{padding:56px 0}
h2{font-size:28px;font-weight:800;margin-bottom:6px}.sub{color:var(--m);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{background:var(--c);border-radius:20px;overflow:hidden;box-shadow:0 4px 18px rgba(11,19,48,.06);transition:.3s;border:1px solid var(--b)}
.card.h{cursor:pointer}.card.h:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(11,19,48,.14)}
.img{height:170px;background:linear-gradient(135deg,var(--r),var(--n)) center/cover;display:grid;place-items:center;font-size:44px}
.pd{padding:20px}.pd small{color:var(--r);font-weight:700;font-size:12px}.pd h3{font-size:17px;margin:4px 0 6px;line-height:1.3}.pd p{color:var(--m);font-size:14px}
.rv{opacity:0;transform:translateY(24px);transition:.6s}.rv.in{opacity:1;transform:none}
.pg{padding:44px 0 70px;min-height:70vh}
.ph{background:var(--n);color:#fff;padding:46px 0 60px}.ph h1{font-size:34px;font-weight:800}.ph p{opacity:.7}
.box{background:var(--c);border-radius:20px;padding:28px;border:1px solid var(--b);margin-bottom:22px}
.box h3{margin-bottom:10px;display:flex;gap:8px;align-items:center}
.box ol{padding-left:20px}.box li{margin:6px 0}
.org{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.org div{background:var(--bg);border-radius:16px;padding:18px;border-top:4px solid var(--r)}.org small{color:var(--m)}.org b{display:block}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
input,select,textarea{font:inherit;padding:11px 16px;border:1px solid var(--b);border-radius:14px;background:#fff;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--r);box-shadow:0 0 0 3px rgba(200,16,46,.12)}
.bar input{flex:2;min-width:200px}.bar select{flex:1;min-width:160px}
.cb{padding:22px;cursor:pointer}.cb h3{font-size:16px;margin-bottom:10px}
.md{display:flex;gap:6px;flex-wrap:wrap}
.bd{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg)}
.Emas{background:#fff3c4;color:#8a6500}.Perak{background:#e9edf3;color:#4a5568}.Perunggu{background:#fde5d3;color:#9c4a1a}
.tw{overflow-x:auto;background:var(--c);border-radius:20px;border:1px solid var(--b)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{background:var(--bg);text-align:left;padding:12px 14px;font-size:12px;text-transform:uppercase;color:var(--m)}
td{padding:11px 14px;border-top:1px solid var(--b)}
.mo{position:fixed;inset:0;background:rgba(11,19,48,.6);backdrop-filter:blur(4px);z-index:100;display:none;place-items:center;padding:16px}
.mo.on{display:grid}
.mb{background:#fff;border-radius:24px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:28px;animation:pop .25s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.fg{margin-bottom:14px}.fg label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{border:0;padding:10px 20px;border-radius:99px;background:#fff;font-weight:700;border:1px solid var(--b)}
.tabs button.on{background:var(--r);color:#fff;border-color:var(--r)}
.fx{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
footer{background:var(--n);color:#fff;padding:36px 0;font-size:14px}footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer p{opacity:.7}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:12px 22px;border-radius:99px;z-index:200;display:none}
.ld{text-align:center;padding:80px;color:var(--m)}
@media(max-width:1000px){.hl{display:none}}
@media(max-width:760px){.burger{display:block}.menu{display:none;position:absolute;top:66px;left:0;right:0;background:var(--n);flex-direction:column;padding:12px}.menu.on{display:flex}.hero{padding:60px 0 100px}.btn.o{margin:8px 0 0}}
.admin-burger{display:none;border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:12px;width:42px;height:42px;font-size:22px;align-items:center;justify-content:center}@media(max-width:800px){nav .w{gap:12px}body.authed .admin-burger{display:flex}nav{z-index:160}.adm{display:block;padding-top:18px}.adm .sb .sbx{display:flex!important}.adm .sb{position:fixed;z-index:151;left:0;top:0;bottom:0;width:min(84vw,310px);height:100dvh;border-radius:0 20px 20px 0;padding:84px 14px 20px;overflow-y:auto;transform:translateX(-105%);transition:transform .28s ease;box-shadow:18px 0 50px #06102b55;flex-direction:column;align-items:stretch}body.admin-nav-open .adm .sb{transform:translateX(0)}body.admin-nav-open #ov{display:block}.adm .sb button{white-space:normal;min-height:46px}.adm .ct{width:100%;min-width:0}.box{padding:18px}.bar{display:grid;grid-template-columns:1fr}.bar input{min-width:0}.tw{max-width:100%}.mb{padding:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* === FIX MOBILE Admin === */
@media(max-width:800px){
nav{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#0b1330!important}
nav .w{justify-content:flex-start!important}
.admin-burger{order:-1;flex:none}
}

/* Logo tanpa latar putih */
.logo i.lg{background:none!important;padding:0!important;width:auto!important;height:46px!important;border-radius:0!important;overflow:visible!important;display:flex;align-items:center}
.logo i.lg img{height:46px!important;width:auto!important;max-width:none!important}
.fl i{background:none!important;padding:0!important;border-radius:0!important}
.fl img{height:68px!important;width:auto}

/* Logo hero tanpa latar putih */
.hl{background:none!important;box-shadow:none!important;border-radius:0!important;padding:0!important}
.hl img{width:240px;filter:drop-shadow(0 16px 30px rgba(0,0,0,.45))}
</style>
<style>#ov{display:none;position:fixed;inset:0;background:#07102799;backdrop-filter:blur(2px);z-index:145}.sbx{display:none!important}.sb .sbx.out{color:var(--r)}
.th{width:40px;height:40px;border-radius:12px;background:var(--r) center/cover no-repeat;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}.ok{color:#15803d;font-weight:700}.no{color:var(--m)}
.sg{font-size:11px;font-weight:800;color:var(--m);text-transform:uppercase;letter-spacing:.08em;padding:14px 16px 4px}
.pv{height:190px;border-radius:16px;background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--m);margin-bottom:10px;font-size:14px}
.adm{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start;padding-top:32px;padding-left:20px;padding-right:20px}
.sb{position:sticky;top:90px;background:#fff;border:1px solid var(--b);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sb button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:13px 16px;border-radius:14px;font-weight:700;color:var(--t);transition:.2s}
.sb button:hover{background:var(--bg)}.sb button.on{background:var(--r);color:#fff;box-shadow:0 8px 20px rgba(200,16,46,.3)}
.ct{min-width:0}
@media(max-width:800px){.adm{grid-template-columns:1fr}.sb{position:static;flex-direction:row;overflow-x:auto}.sb button{white-space:nowrap}}
</style>
</head>
<body>
<nav><div class="w">
  <button class="admin-burger" aria-label="Buka menu admin" onclick="toggleAdminDrawer()">☰</button>
  <div class="logo"><i class="lg"><img data-logo alt="Logo KONI HSU"></i><div>Admin KONI<small>Hulu Sungai Utara</small></div></div>
  <div class="menu"><a href="index.html" target="_top">← Ke Website</a><a id="out" style="display:none;background:var(--g);color:var(--n);opacity:1" onclick="logout()">Keluar</a></div>
</div></nav>
<main id="app"></main>
<div class="mo" id="mo" onclick="if(event.target===this)closeM()"><div class="mb" id="mb"></div></div>
<div id="toast"></div>
<div id="ov" onclick="toggleAdminDrawer()"></div>
<script src="config.js"></script>
<script src="logo.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const run=(fn,...a)=>api(fn,...a).catch(e=>{if(TOKEN&&/Sesi berakhir/.test(String(e&&e.message))){TOKEN='';A=null;closeM();render()}throw e});
const SITE=document.querySelector('.menu a').href;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)};
document.querySelectorAll('img[data-logo]').forEach(i=>i.src=LOGO);
let A=null,TOKEN='',tab='Berita',aq='',UP=false;
const MK='Porprov 2025 (Medali)';
const OY=['Ya','Tidak'],KT=['Perorangan','Beregu'];
const FORM={
 Berita:[['Judul'],['Ringkasan'],['Isi','t'],['Gambar','i'],['Tanggal','d'],['Status','s',['Terbit','Draft']]],
 Cabor:[['Nama Cabor'],['Ketua Cabor'],['Pendamping']],
 Pertandingan:[['Cabor','c'],['Nama Pertandingan'],['Kategori','s',KT]],
 DataAtlet:[['Nama Atlet'],['Cabor','c'],['Jenis Kelamin','s',['','Laki-laki','Perempuan']],['Tanggal Lahir','d'],['Alamat'],['NIK KTP','n'],['Foto KTP','k'],['Foto Profil','i']],
 Atlet:[['Cabor','c'],['Pertandingan','p'],['Nama Atlet','a'],['Kategori','s',KT],['Medali','s',['','Emas','Perak','Perunggu']],['Atelet Porprov 2022','s',OY],['Prestasi Porprov 2022','s',OY],[MK]]
};
const CFG={
 Cabor:{k:'ID',dk:'cabor',t:'Master Cabang Olahraga',d:'Daftar cabang olahraga beserta ketua dan pendamping — dipakai sebagai pilihan pada menu lainnya',add:'Cabor',cols:['Nama Cabor','Ketua Cabor','Pendamping'],sort:1},
 Pertandingan:{k:'ID',dk:'pertandingan',t:'Jenis Pertandingan',d:'Nomor / jenis pertandingan pada tiap cabang olahraga',add:'Pertandingan',cols:['Cabor','Nama Pertandingan','Kategori'],sort:1},
 DataAtlet:{k:'ID',dk:'dataatlet',t:'Data Atlet',d:'Master data atlet. Foto Profil tampil di website; NIK KTP dan Foto KTP bersifat privat (hanya terlihat di halaman admin ini)',add:'Atlet',cols:['Foto Profil','Nama Atlet','Cabor','Jenis Kelamin','NIK KTP','Foto KTP'],sk:['Nama Atlet','Cabor'],q:['Nama Atlet','Cabor','Jenis Kelamin','NIK KTP'],sort:1},
 Atlet:{k:'No',dk:'atlet',t:'Prestasi Atlet Porprov 2025',d:'Data prestasi atlet pada Porprov 2025 — tampil di halaman Cabang Olahraga website',add:'Prestasi',cols:['Nama Atlet','Cabor','Pertandingan','Medali']}
};
const MENU=[['Berita','📰','Berita','Kelola berita yang tampil di menu Berita website'],['Profil','👥','Profil','Kelola visi, misi, sejarah, struktur organisasi, dan kontak'],['-','Cabang Olahraga'],['Cabor','🏟️','Master Cabor',CFG.Cabor.d],['Pertandingan','🎯','Jenis Pertandingan',CFG.Pertandingan.d],['DataAtlet','🏃','Data Atlet',CFG.DataAtlet.d],['Atlet','🏅','Prestasi Porprov 2025',CFG.Atlet.d]];

const PF=[['visi','Visi','t'],['misi','Misi (satu baris = satu poin)','t'],['sejarah','Sejarah / Tentang','t'],['struktur','Struktur Organisasi (format: Jabatan | Nama, satu per baris)','t'],['alamat','Alamat'],['telepon','Telepon'],['email','Email']];
function toggleAdminDrawer(){document.body.classList.toggle('admin-nav-open')}
function render(){$('#app').innerHTML=admin();$('#out').style.display=TOKEN?'':'none';document.body.classList.toggle('authed',!!(TOKEN&&A));if(!TOKEN)document.body.classList.remove('admin-nav-open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('admin-nav-open');closeM()}});
function logout(){TOKEN='';A=null;closeM();render()}

function admin(){
  if(!TOKEN)return `<div class="w pg" style="max-width:420px"><div class="box"><h2>🔐 Login Admin</h2><p class="sub">Masukkan password admin</p><div class="fg"><input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"></div><button class="btn" onclick="doLogin()">Masuk</button></div></div>`;
  if(!A)return `<div class="ld">Memuat data admin…</div>`;
  const cur=MENU.find(m=>m[0]===tab);
  return `<div class="w pg adm" style="max-width:1300px"><aside class="sb">${MENU.map(m=>m[0]==='-'?`<div class="sg">${m[1]}</div>`:`<button class="${tab===m[0]?'on':''}" onclick="tab='${m[0]}';aq='';document.body.classList.remove('admin-nav-open');render()"><span>${m[1]}</span>${m[2]}</button>`).join('')}<div class="sg sbx">Akun</div><button class="sbx" onclick="window.open(SITE,'_top')"><span>🌐</span>Lihat Website</button><button class="sbx out" onclick="document.body.classList.remove('admin-nav-open');logout()"><span>🚪</span>Keluar</button></aside>
  <div class="ct"><h2>${CFG[tab]?CFG[tab].t:cur[2]}</h2><p class="sub">${cur[3]}</p>${tab==='Berita'?aBerita():tab==='Profil'?aProfil():aList(tab)}</div></div>`}
function doLogin(){const b=$('#app .btn');if(b.disabled)return;b.disabled=true;run('login',$('#pw').value).then(t=>{TOKEN=t;render();loadA()}).catch(e=>{b.disabled=false;toast(e.message)})}
function loadA(){run('getAdminData',TOKEN).then(d=>{A=d;render()}).catch(e=>{toast(e.message);TOKEN='';render()})}
function aBerita(){return `<div class="fx" style="margin-bottom:14px"><b>${A.berita.length} berita</b><button class="btn s" onclick="edit('Berita')">＋ Tambah Berita</button></div><div class="tw"><table><tr><th>Judul</th><th>Tanggal</th><th>Status</th><th></th></tr>${A.berita.map(b=>`<tr><td>${esc(b.Judul)}</td><td>${esc(b.Tanggal)}</td><td>${esc(b.Status)}</td><td style="white-space:nowrap">${btns('Berita',b.ID)}</td></tr>`).join('')}</table></div>`}
const btns=(n,id)=>`<button class="btn s g" onclick="edit('${n}','${esc(id)}')">Edit</button> <button class="btn s d" onclick="del('${n}','${esc(id)}')">Hapus</button>`;
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function cell(k,r){
  if(k==='Foto Profil'){const v=r[k];return v?`<div class="th" style="background-image:url('${esc(v)}')"></div>`:`<div class="th">${esc(ini(r['Nama Atlet']))}</div>`}
  if(k==='Foto KTP')return r[k]?'<span class="ok">✓ Ada</span>':'<span class="no">— Belum</span>';
  return esc(r[k])}
function aList(t){const c=CFG[t],q=aq.toLowerCase(),sk=c.sk||[c.cols[0],c.cols[1]],qk=c.q||c.cols;let f=A[c.dk].filter(r=>!q||qk.map(k=>r[k]).join(' ').toLowerCase().includes(q));
  if(c.sort)f=f.slice().sort((a,b)=>sk.map(k=>a[k]).join('|').localeCompare(sk.map(k=>b[k]).join('|')));
  const hd=k=>k==='Foto Profil'?'Foto':k;
  return `<div class="bar"><input placeholder="🔍 Cari…" value="${esc(aq)}" onchange="aq=this.value;render()"><button class="btn s" onclick="edit('${t}')">＋ Tambah ${c.add}</button></div><p class="sub">${f.length} data${f.length>100?' (menampilkan 100 teratas — gunakan pencarian)':''}</p><div class="tw"><table><tr>${c.cols.map(k=>`<th>${hd(k)}</th>`).join('')}<th></th></tr>${f.slice(0,100).map(r=>`<tr>${c.cols.map(k=>`<td>${cell(k,r)}</td>`).join('')}<td style="white-space:nowrap">${btns(t,r[c.k])}</td></tr>`).join('')}</table></div>`}
function aProfil(){return `<div class="box">${PF.map(([k,l,t])=>`<div class="fg"><label>${l}</label>${t?`<textarea rows="4" id="pf_${k}">${esc(A.profil[k])}</textarea>`:`<input id="pf_${k}" value="${esc(A.profil[k])}">`}</div>`).join('')}<button class="btn" id="btnPf" onclick="saveProfil()">Simpan Profil</button></div>`}
async function saveProfil(){const b=$('#btnPf');b.disabled=true;try{for(const [k] of PF)await run('saveRow',TOKEN,'Profil',{Kunci:k,Nilai:$('#pf_'+k).value});toast('Profil tersimpan');refresh()}catch(e){toast(e.message);const x=$('#btnPf');if(x)x.disabled=false}}
const cabNames=()=>A.cabor.map(c=>c['Nama Cabor']).filter(Boolean).sort((a,b)=>a.localeCompare(b));
const pertNames=cab=>[...new Set(A.pertandingan.filter(p=>!cab||p.Cabor===cab).map(p=>p['Nama Pertandingan']))].sort((a,b)=>a.localeCompare(b));
const athOpts=cab=>A.dataatlet.filter(a=>!cab||a.Cabor===cab).map(a=>`<option value="${esc(a['Nama Atlet'])}">`).join('');
const opts=(l,v)=>{v=v==null?'':v;l=l.includes(v)?l:[...l,v];return l.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')};
function cabChg(){const cab=$('#mb [data-k="Cabor"]').value;$('#fp').innerHTML=opts(['',...pertNames(cab)],'');$('#dl').innerHTML=athOpts(cab)}
function pertChg(){const cab=$('#mb [data-k="Cabor"]').value,p=$('#fp').value,m=A.pertandingan.find(x=>x.Cabor===cab&&x['Nama Pertandingan']===p);if(m&&m.Kategori)$('#mb [data-k="Kategori"]').value=m.Kategori}
function edit(n,id){
  const c=CFG[n]||{k:'ID',dk:'berita'},r=id?A[c.dk].find(x=>String(x[c.k])===String(id)):{},cab=r.Cabor||'';
  const fld=FORM[n].map(([k,t,o])=>{const v=r[k]==null?(k==='Tanggal'&&n==='Berita'?new Date().toISOString().slice(0,10):''):r[k];let inp;
    if(t==='i'||t==='k')inp=imgField(k,v,t==='k'?'ktp':n==='Berita'?'berita':'profil');
    else if(t==='n')inp=`<input data-k="${k}" inputmode="numeric" placeholder="16 digit NIK" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,16)" value="${esc(v)}">`;
    else if(t==='t')inp=`<textarea rows="5" data-k="${k}">${esc(v)}</textarea>`;
    else if(t==='c')inp=`<select data-k="${k}" ${n==='Atlet'?'onchange="cabChg()"':''}>${opts(['',...cabNames()],v)}</select>`;
    else if(t==='p')inp=`<select data-k="${k}" id="fp" onchange="pertChg()">${opts(['',...pertNames(cab)],v)}</select>`;
    else if(t==='a')inp=`<input data-k="${k}" list="dl" value="${esc(v)}" placeholder="Ketik atau pilih dari Data Atlet"><datalist id="dl">${athOpts(cab)}</datalist>`;
    else if(t==='s')inp=`<select data-k="${k}">${opts(o,v)}</select>`;
    else inp=`<input ${t==='d'?'type="date"':''} data-k="${k}" value="${esc(v)}">`;
    return `<div class="fg"><label>${k}</label>${inp}</div>`}).join('');
  openM(`<h2 style="margin-bottom:16px">${id?'Edit':'Tambah'} ${c.add||'Berita'}</h2>${fld}<div class="fx"><button class="btn g" onclick="closeM()">Batal</button><button class="btn" onclick="saveF('${n}','${id?esc(id):''}')">Simpan</button></div>`);if(r['Foto KTP'])loadKtp(r['Foto KTP'])}
function saveF(n,id){if(UP)return toast('Tunggu, foto sedang diunggah');const c=CFG[n]||{k:'ID'},o={};o[c.k]=id;document.querySelectorAll('#mb [data-k]').forEach(e=>o[e.dataset.k]=e.value);
  if(n==='Berita')o.Gambar=driveImg(o.Gambar);
  const need={Berita:'Judul',Cabor:'Nama Cabor',Pertandingan:'Nama Pertandingan',DataAtlet:'Nama Atlet',Atlet:'Nama Atlet'}[n];if(!String(o[need]||'').trim())return toast(need+' wajib diisi');
  if(n==='DataAtlet'&&o['NIK KTP']&&!/^\d{16}$/.test(o['NIK KTP']))return toast('NIK KTP harus 16 digit angka');
  run('saveRow',TOKEN,n,o).then(()=>{closeM();toast('Tersimpan');refresh()}).catch(e=>toast(e.message))}
function driveImg(u){const m=String(u).match(/drive\.google\.com\/file\/d\/([^\/]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000':u}
let ASK=null;
function ask(msg){return new Promise(ok=>{ASK=ok;openM(`<h2 style="margin-bottom:10px">Konfirmasi</h2><p style="margin-bottom:20px">${esc(msg)}</p><div class="fx"><button class="btn g" onclick="askR(false)">Batal</button><button class="btn d" onclick="askR(true)">Ya, Hapus</button></div>`)})}
function askR(v){const f=ASK;ASK=null;closeM();f&&f(v)}
async function del(n,id){if(!await ask('Hapus data ini? Tindakan ini tidak dapat dibatalkan.'))return;run('deleteRow',TOKEN,n,id).then(()=>{toast('Dihapus');refresh()}).catch(e=>toast(e.message))}
function refresh(){run('getAdminData',TOKEN).then(d=>{A=d;render()}).catch(e=>toast(e.message))}

const sid=k=>k.replace(/\W/g,'');
function imgField(k,v,jn){const i=sid(k),ktp=jn==='ktp';return `<div><div class="pv" id="pv${i}" style="${v&&!ktp?`background-image:url('${esc(v)}')`:''}">${v?(ktp?'Memuat foto…':''):'Belum ada foto'}</div><input type="hidden" data-k="${k}" id="gm${i}" value="${esc(v)}"><div class="fx" style="justify-content:flex-start"><label class="btn s g" style="cursor:pointer">📷 Pilih Foto<input type="file" accept="image/*" hidden onchange="pickImg(this,'${k}','${jn}')"></label><button type="button" class="btn s d" onclick="setImg('${k}','')">Hapus Foto</button><small id="ust${i}" style="color:var(--m)"></small></div>${ktp?'<small style="color:var(--m)">🔒 Privat — hanya terlihat di halaman admin</small>':''}${jn==='berita'?`<input placeholder="atau tempel URL gambar (opsional)" onchange="setImg('${k}',driveImg(this.value.trim()))" style="margin-top:10px;font-size:13px">`:''}</div>`}
function setImg(k,u,disp){const i=sid(k);$('#gm'+i).value=u;const pv=$('#pv'+i),d=disp||u;pv.style.backgroundImage=d?`url('${d}')`:'none';pv.textContent=d?'':'Belum ada foto'}
function loadKtp(id){run('getFotoKtp',TOKEN,id).then(d=>{const pv=$('#pvFotoKTP');if(pv){pv.style.backgroundImage=`url('${d}')`;pv.textContent=''}}).catch(()=>{const pv=$('#pvFotoKTP');if(pv)pv.textContent='Foto tidak bisa dimuat'})}
function pickImg(inp,k,jn){const f=inp.files[0];if(!f)return;const i=sid(k);
  if(!f.type.startsWith('image/'))return toast('File harus berupa gambar');
  UP=true;$('#ust'+i).textContent='Memproses…';
  const img=new Image,url=URL.createObjectURL(f);
  img.onload=()=>{const M=jn==='ktp'?1600:1200,r=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const d=c.toDataURL('image/jpeg',.85);$('#ust'+i).textContent='Mengunggah…';
    run('uploadFoto',TOKEN,d,f.name,jn).then(u=>{setImg(k,u,jn==='ktp'?d:u);$('#ust'+i).textContent='Terunggah ✓'}).catch(e=>{$('#ust'+i).textContent='';toast(e.message)}).finally(()=>{UP=false;inp.value=''})};
  img.onerror=()=>{UP=false;$('#ust'+i).textContent='';toast('Gambar tidak bisa dibaca')};img.src=url}
function openM(h){$('#mb').innerHTML=h;$('#mo').classList.add('on')}
function closeM(){const f=ASK;ASK=null;$('#mo').classList.remove('on');f&&f(false)}
render();
</script>
</body>
</html>
